services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: survey-ai-workspace-postgres
    environment:
      POSTGRES_USER: survey_ai
      POSTGRES_PASSWORD: survey_ai
      POSTGRES_DB: survey_ai_workspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_ai -d survey_ai_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: survey-ai-workspace-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://survey_ai:survey_ai@postgres:5432/survey_ai_workspace?sslmode=disable
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
